<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" preserveAspectRatio="none" data-capsule-type="waving" data-color-mode="animated-gradient" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Render type=waving animated gradient header</title>
  <desc id="desc">Two layered, rounded waves with a continuously cycling deep-blue, cyan, and violet gradient.</desc>
  <defs>
    <linearGradient id="waving-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop id="waving-start" offset="0%" stop-color="#0b1b2b" />
      <stop id="waving-mid" offset="52%" stop-color="#123f5a" />
      <stop id="waving-end" offset="100%" stop-color="#237a93" />
    </linearGradient>
    <style>
      #waving-start { animation: waving-color-start 18s ease-in-out infinite; }
      #waving-mid { animation: waving-color-mid 18s ease-in-out infinite; }
      #waving-end { animation: waving-color-end 18s ease-in-out infinite; }
      @keyframes waving-color-start {
        0%, 100% { stop-color: #0b1b2b; }
        33% { stop-color: #31265e; }
        66% { stop-color: #063c4c; }
      }
      @keyframes waving-color-mid {
        0%, 100% { stop-color: #123f5a; }
        33% { stop-color: #704a82; }
        66% { stop-color: #0f8a8a; }
      }
      @keyframes waving-color-end {
        0%, 100% { stop-color: #237a93; }
        33% { stop-color: #d2769f; }
        66% { stop-color: #49c2b2; }
      }
      @media (prefers-reduced-motion: reduce) {
        #waving-start, #waving-mid, #waving-end { animation: none; }
      }
    </style>
  </defs>
  <g transform="translate(640 110) scale(1 1) translate(-640 -110)">
    <path d="M0 0 L0 140 Q320 180 640 150 T1280 175 L1280 0 Z" fill="url(#waving-gradient)" opacity="0.90">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0 L0 140 Q320 180 640 150 T1280 175 L1280 0 Z;M0 0 L0 165 Q320 180 640 160 T1280 150 L1280 0 Z;M0 0 L0 185 Q320 155 640 185 T1280 150 L1280 0 Z;M0 0 L0 140 Q320 180 640 150 T1280 175 L1280 0 Z"
      />
    </path>
    <path d="M0 0 L0 155 Q320 200 640 170 T1280 180 L1280 0 Z" fill="url(#waving-gradient)" opacity="0.46">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-10s"
        values="M0 0 L0 155 Q320 200 640 170 T1280 180 L1280 0 Z;M0 0 L0 170 Q320 140 640 140 T1280 160 L1280 0 Z;M0 0 L0 165 Q320 145 640 170 T1280 185 L1280 0 Z;M0 0 L0 155 Q320 200 640 170 T1280 180 L1280 0 Z"
      />
    </path>
  </g>
</svg>
